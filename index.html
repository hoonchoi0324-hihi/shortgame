<!doctype html>
<html lang="ko">
<head>

<meta name="theme-color" content="#1B1F3B">

<meta property="og:type" content="website">
<meta property="og:title" content="넘겨 한 판">
<meta property="og:description" content="위로 넘기면 바로 다음 판. 5초 미니게임 51개로 알아보는 내 게임 취향.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --sheet:#FFFFFF;--sheet-ink:#1B1F3B;--muted:#5B6078;--line:#E3E5EE;--accent:#2F4BFF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sheet:#1E2240;--sheet-ink:#F2F3F8;--muted:#A8ADC6;--line:#343A63;--accent:#8A9BFF;}}
:root[data-theme="dark"]{--sheet:#1E2240;--sheet-ink:#F2F3F8;--muted:#A8ADC6;--line:#343A63;--accent:#8A9BFF;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:#1B1F3B}
body{margin:0;height:100%;background:#1B1F3B;font-family:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid currentColor;outline-offset:3px}

#stage{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;touch-action:none}
.hud{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:8;
  color:#fff;font-weight:600;font-size:15px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.hud .hearts{font-size:20px;letter-spacing:2px}
.hud .mid{display:flex;gap:10px;align-items:baseline}
.hud .sc{font-family:'Black Han Sans',sans-serif;font-size:22px;font-weight:400}
.hud button{pointer-events:auto;border:0;background:rgba(0,0,0,.25);width:36px;height:36px;border-radius:50%;font-size:16px}
.hud.hit .hearts{animation:hurt .5s}
@keyframes hurt{30%{transform:scale(1.4)}}

.card{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.card.below{transform:translateY(100%)}.card.above{transform:translateY(-100%)}
.play{flex:1;position:relative;min-height:0;overflow:hidden}
.inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:96px 78px 10px 18px}
.meta{padding:6px 84px 20px 20px}
.count{margin:0 0 2px;font-size:13px;opacity:.75}
.meta h2{margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(26px,7.5vw,36px);line-height:1.05}
.tags{display:flex;gap:6px;margin-top:8px}
.tags span{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.rail{position:absolute;right:12px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:6}
.rail button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:0;width:56px}
.rail button span{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;background:color-mix(in srgb,var(--ink) 15%,transparent);transition:transform .15s}
.rail button:active span{transform:scale(.88)}
.rail small{font-size:11px;font-weight:600;opacity:.85}
.rail [aria-pressed="true"] span{background:var(--ink);color:var(--bg)}

.fuse{position:absolute;top:50px;left:18px;right:18px;height:7px;border-radius:4px;background:color-mix(in srgb,var(--ink) 18%,transparent);z-index:5;overflow:hidden}
.fuse i{display:block;height:100%;background:currentColor;transform-origin:left;transform:scaleX(1)}
.fuse i.run{animation:shrink linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.tip{position:absolute;top:64px;left:18px;right:18px;text-align:center;font-family:'Black Han Sans',sans-serif;font-size:22px;z-index:5;opacity:0;transition:opacity .2s}
.tip.on{opacity:.9}
.cmd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 20px;z-index:7;pointer-events:none;
  font-family:'Black Han Sans',sans-serif;font-size:clamp(52px,16vw,92px);line-height:1;opacity:0;text-shadow:0 5px 0 rgba(0,0,0,.18)}
.cmd.show{animation:cmdIn .7s forwards}
@keyframes cmdIn{0%{opacity:0;transform:scale(.3) rotate(-8deg)}22%{opacity:1;transform:scale(1.12) rotate(2deg)}40%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.25)}}

.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:90px 78px 20px 18px;text-align:center;z-index:6;border:0}
.res{background:color-mix(in srgb,var(--bg) 78%,transparent)}
.stamp{font-family:'Black Han Sans',sans-serif;font-size:clamp(60px,19vw,96px);line-height:1;transform:rotate(-7deg);animation:stamp .28s cubic-bezier(.3,1.6,.5,1)}
.lose .stamp{transform:rotate(5deg)}
@keyframes stamp{from{transform:scale(2.2) rotate(-7deg);opacity:0}}
.res .sub{font-size:17px;font-weight:600}
.hint{margin-top:18px;font-weight:600;font-size:15px;opacity:.85;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-8px)}}
.sub{margin:0;font-size:16px;opacity:.85;line-height:1.5;max-width:28ch}
.bigtxt{font-family:'Black Han Sans',sans-serif;font-size:clamp(34px,10vw,52px);line-height:1.1}
.pill{flex:1;max-width:190px;min-height:56px;padding:0 12px;border-radius:28px;border:2px solid currentColor;background:transparent;font-weight:600;font-size:17px}
.pill.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
.g-col{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:420px;text-align:center}
.field{position:relative;align-self:stretch;flex:1}
.cf{position:absolute;left:50%;top:45%;width:10px;height:14px;border-radius:2px;z-index:7;pointer-events:none}
.pp{position:absolute;z-index:7;pointer-events:none;font-size:28px}

/* games */
.mosq{position:absolute;left:0;top:0;width:66px;height:66px;font-size:40px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.track{position:relative;width:100%;height:64px;border-radius:32px;background:rgba(0,0,0,.14);overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:#19C39A}
.needle{position:absolute;top:7px;bottom:7px;width:9px;border-radius:5px;background:#1B1F3B;transform:translateX(-50%)}
.bal{position:absolute;width:72px;height:80px;margin:-40px 0 0 -36px;font-size:54px;border:0;background:none;padding:0;animation:bob 1.2s ease-in-out infinite}
.bal:nth-child(2n){animation-delay:-.6s}
@keyframes bob{50%{transform:translateY(-8px)}}
.grid{display:grid;gap:6px;width:min(100%,330px)}
.grid button{aspect-ratio:1;border:0;border-radius:14px;background:rgba(255,255,255,.14);font-size:clamp(24px,7vw,34px);padding:0}
.sheep{position:absolute;font-size:38px;transform:translate(-50%,-50%)}
.redbtn{width:min(62vw,230px);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#FF7A7A,#E0142B 60%,#9A0015);
  color:#fff;font-family:'Black Han Sans',sans-serif;font-size:26px;box-shadow:0 12px 0 #7A0012;animation:wob .9s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-4deg) scale(1.03)}75%{transform:rotate(4deg) scale(.98)}}
.doors{display:flex;gap:12px;width:100%;max-width:360px;justify-content:center}
.door{flex:1;aspect-ratio:.55;border:0;border-radius:10px 10px 4px 4px;background:linear-gradient(#3A2A1E,#231811);position:relative;box-shadow:inset 0 0 0 3px #4E3A2A;padding:0}
.door::before{content:'';position:absolute;right:14%;top:52%;width:10px;height:10px;border-radius:50%;background:#C9A45C}
.door::after{content:'';position:absolute;left:8%;right:8%;bottom:-6px;height:6px;border-radius:3px;background:transparent;transition:background .08s,box-shadow .08s}
.door.red::after{background:#FF2B2B;box-shadow:0 0 18px 6px rgba(255,40,40,.7)}
.door.faint::after{background:#8A1B1B;box-shadow:0 0 10px 3px rgba(255,40,40,.35)}
.door.open{background:#0A0B14;box-shadow:inset 0 0 0 3px #4E3A2A}
.door.open::before{display:none}
.hall{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,#26243A 0%,#0A0B14 60%)}
.eye{position:absolute;left:50%;top:48%;width:110px;height:10px;transform:translate(-50%,-50%);border-radius:50%;background:#FF2B2B;box-shadow:0 0 24px 8px rgba(255,30,30,.6);
  opacity:0;transition:height .12s,opacity .12s}
.eye.open{opacity:1;height:48px}
.scare{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48vmin;background:#3A0000;z-index:5}
.cat{font-size:clamp(110px,34vw,160px);border:0;background:none;padding:0;line-height:1;transition:transform .08s}
.meter{width:min(100%,280px);height:14px;border-radius:7px;background:color-mix(in srgb,var(--ink) 18%,transparent);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ink);transition:width .1s}
.orb{width:min(58vw,230px);aspect-ratio:1;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 40% 35%,#FFFFFF,#6CC4FF 55%,#2C8BD6);box-shadow:0 0 0 0 rgba(255,255,255,.7)}
.orb.flash{box-shadow:0 0 0 22px rgba(255,255,255,0);transition:box-shadow .4s}
.dots{display:flex;gap:8px;font-size:20px}
.shop{display:flex;gap:12px;width:100%;max-width:380px}
.shop button{flex:1;border:0;border-radius:20px;background:rgba(255,255,255,.55);padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.shop b{font-size:40px;line-height:1}.shop span{font-weight:600;font-size:18px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--sheet);color:var(--sheet-ink);width:100%;max-width:560px;border-radius:26px 26px 0 0;
  padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:30px;line-height:1.1}
.sheet .over-score{font-family:'Black Han Sans',sans-serif;font-size:64px;line-height:1;margin:4px 0}
.sheet .lead{margin:0;color:var(--muted);font-weight:600}
.sheet .desc{margin:8px 0 0;color:var(--muted);line-height:1.55}
.sheet hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.bars{list-style:none;padding:0;margin:16px 0 4px;display:grid;gap:9px}
.bars li{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px;font-weight:600;font-size:14px}
.bars div{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bars i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .5s}
.sheet .note{font-size:13px;color:var(--muted);margin:12px 0 16px;line-height:1.5}
.sheet .pill{color:var(--sheet-ink);border-color:var(--sheet-ink)}
.sheet .pill.solid{background:var(--sheet-ink);color:var(--sheet)}
.toast{position:fixed;top:0;left:50%;transform:translateX(-50%);padding-top:calc(env(safe-area-inset-top,0px) + 54px);z-index:30;pointer-events:none;display:none}
.toast span{display:block;background:#1B1F3B;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap}
.intro h1{margin:0;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(56px,18vw,96px);line-height:.95}

.bal.still{animation:none}
.bigemo{font-size:clamp(96px,30vw,150px);line-height:1}
.bigemo.pulse{animation:pulse .3s}
@keyframes pulse{50%{transform:scale(1.3)}}
.g-col{position:relative;z-index:1}
.pl,.fall{position:absolute;left:0;top:0;line-height:1}
.pl{font-size:44px;transition:transform .08s;z-index:2}
.fall{font-size:40px}
.lhint{position:absolute;left:0;right:0;bottom:-2px;display:flex;justify-content:space-between;font-size:12px;font-weight:600;opacity:.45;pointer-events:none}
.num{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#1B1F3B;font-family:'Black Han Sans',sans-serif;font-size:26px;padding:0}
.cups{position:absolute;inset:0}
.cup{position:absolute;top:42%;transform:translate(-50%,-50%);font-size:64px;border:0;background:none;padding:0;transition:left .22s ease-in-out}
.shellsub{position:absolute;bottom:4px;left:0;right:0;text-align:center;max-width:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(100%,280px)}
.pad{aspect-ratio:1;border:0;border-radius:24px;opacity:.4;transition:opacity .1s,transform .1s}
.p0{background:#FFE14D}.p1{background:#2F4BFF}.p2{background:#19C39A}.p3{background:#FFFFFF}
.pad.lit{opacity:1;transform:scale(1.06)}
.arrows{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,280px)}
.ab{height:72px;border-radius:18px;border:2px solid currentColor;background:transparent;font-size:34px;font-weight:600}
.ab.sm{font-size:24px}
.col{display:flex;flex-direction:column;gap:10px;width:min(100%,300px)}
.pill.tray{max-width:none;font-size:28px;letter-spacing:4px}
.wires{display:flex;flex-direction:column;gap:16px;width:min(100%,300px)}
.wire{height:28px;border-radius:14px;border:0;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.floors{gap:8px;width:min(100%,300px)}
.floors .fl{aspect-ratio:1;border-radius:50%;border:2px solid currentColor;background:transparent;font-weight:600;font-size:17px;padding:0}
.fl.hot{animation:flick .35s steps(2) infinite}
@keyframes flick{50%{color:#FF3B3B;border-color:#FF3B3B;box-shadow:0 0 12px rgba(255,40,40,.6)}}
.redbtn.dk{background:radial-gradient(circle at 35% 30%,#4A3A6A,#1E1530 65%,#0A0710);box-shadow:0 12px 0 #05030A;color:#D8CCF0;font-size:22px}
.orb{display:flex;align-items:center;justify-content:center;font-size:64px}
.g-dark{position:absolute;inset:0;overflow:hidden;cursor:crosshair}
.hud2{position:absolute;top:64px;left:20px;right:80px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;z-index:3;opacity:.8}
.bat{width:72px;height:16px;border:2px solid currentColor;border-radius:4px;padding:1px}
.bat b{display:block;height:100%;width:100%;background:currentColor;transition:width .2s}
.eyes{position:absolute;display:flex;gap:12px;transform:translate(-50%,-50%);opacity:.06;transition:opacity .15s;z-index:2;pointer-events:none}
.eyes i{width:16px;height:9px;border-radius:50%;background:#FF3B3B;box-shadow:0 0 12px #FF3B3B}
.eyes.glint{opacity:.45}.eyes.seen{opacity:1}
.beam{position:absolute;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(255,240,190,.5),rgba(255,240,190,0) 70%);animation:fadeb .5s ease-out forwards}
@keyframes fadeb{to{opacity:0}}
.shopb{flex:1;border:0;border-radius:20px;background:rgba(255,255,255,.55);padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.credit{position:absolute;bottom:18px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;opacity:.6}
@media (prefers-reduced-motion: reduce){.card{transition:none}.cmd.show{animation-duration:.01s}.bal,.redbtn,.hint{animation:none}}
</style>
</head>
<body>
<main id="stage">
  <div class="hud" id="hud"><span class="hearts" data-h>❤️❤️❤️</span><span class="mid"><span class="sc" data-sc>0점</span><span data-lv>속도 1</span></span><button data-mute aria-label="소리 끄기">🔊</button></div>
</main>
<script>
const GENRES={reflex:'반사신경',puzzle:'두뇌',horror:'공포',chill:'힐링',biz:'장사'};
const TYPES={
  reflex:['번개손 반응형','생각보다 손이 먼저 나가요. 빠르게 끝나는 판에서 제일 신나요.'],
  puzzle:['눈치 빠른 두뇌형','규칙을 읽고 맞히는 순간이 좋아요. 헷갈리는 판에서 오히려 버텨요.'],
  horror:['스릴 사냥꾼','어두운 데서 뭔가 튀어나올 때 오히려 눈이 반짝여요.'],
  chill:['느긋한 힐러','이기고 지는 것보다 손끝 기분이 중요해요. 편안한 판을 끝까지 해요.'],
  biz:['계산 빠른 사장님','숫자를 굴려서 이득을 보는 판에 끌려요. 셈이 빨라요.']
};
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const won=n=>n.toLocaleString('ko-KR');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sound & feel ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.1,type='square',v=.06,when=0,f2){const a=ac();if(!a||muted)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}
function noise(d=.45,v=.25){const a=ac();if(!a||muted)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=a.createBufferSource(),g=a.createGain();g.gain.value=v;s.buffer=b;s.connect(g).connect(a.destination);s.start()}
const sfx={
  tap:()=>tone(620,.05,'square',.03),
  good:()=>tone(880,.07,'triangle',.07),
  go:()=>{tone(523,.07,'square',.05);tone(784,.1,'square',.05,.08)},
  win:()=>{tone(660,.09,'triangle',.09);tone(880,.09,'triangle',.09,.08);tone(1320,.2,'triangle',.09,.16)},
  lose:()=>tone(260,.4,'sawtooth',.06,0,80),
  pop:()=>tone(300,.08,'sine',.12,0,900),
  scare:()=>{noise(.5,.35);tone(90,.5,'sawtooth',.12,0,40)},

G('coins','biz','빠름',4400,'#2E7D5B','#FFF4C2','동전 주워!','떨어진 동전',E.popAll({e:'🪙',p:'✨',n:5,bob:false,label:'동전',snd:()=>tone(1200,.08,'triangle',.07),w:'한 푼도 안 놓쳤어요'}),{timeMsg:'동전이 굴러갔어요'}),
G('shout','biz','빠름',4600,'#FF9F1C','#2A1600','호객!','가게 앞 영업',E.mash({st:['🏪','🏪🧍','🏪🧍🧍','🏪🧍🧍🧍'],pt:'📣',n:9,label:'외치기',w:'가게가 북적북적'}),{timeMsg:'손님이 옆 가게로 갔어요'}),
G('money','biz','느림',5800,'#1F6F50','#EFFFF6','몇 개?','금고 세기',E.count({e:'💰',u:'개',w:'장부랑 딱 맞아요'}),{timeMsg:'장부를 덮었어요'}),
G('cash','biz','빠름',5600,'#DDF7E3','#0D3B1E','돈만 받아!','청구서 조심',E.lanes({mode:'catch',pl:'👛',e:'💸',bad:'🧾',need:5,hurt:'😵',l:'청구서를 받아버렸어요',w:'지갑이 두둑해요'}),{timeMsg:'돈이 다 떨어졌어요'}),
G('stock','biz','빠름',4600,'#A7E0FF','#0A2A40','제일 적은 거!','재고 체크',E.pick({gen:()=>{const it=shuffle(['🍎','🍌','🍇','🍑','🥝','🍐']).slice(0,4),ns=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,4),m=ns.indexOf(Math.min(...ns));
  return{opts:it.map((e,i)=>`${e}×${ns[i]}`),ans:m,cls:'arrows',btn:'ab sm',html:'<p class="sub">제일 조금 남은 걸 먼저 주문해요</p>',w:'재고 관리 완벽',l:`${it[m]}가 제일 적었어요`}}}),{timeMsg:'품절됐어요'}),
G('promo','biz','느림',6000,'#C77DFF','#FFFFFF','제일 이득!','행사 고르기',E.pick({gen:()=>{const D=[['1+1',.5],['2+1',.667],['3+1',.75],['30% 할인',.7],['40% 할인',.6],['45% 할인',.55],['35% 할인',.65]];let s;
  do s=shuffle(D).slice(0,3);while(new Set(s.map(x=>x[1])).size<3);const m=s.reduce((a,x,i)=>x[1]<s[a][1]?i:a,0);
  return{opts:s.map(x=>x[0]),ans:m,html:'<p class="sub">한 개 값이 제일 싸지는 행사는?</p>',w:'진짜 알뜰한 사장님',l:`${s[m][0]}가 제일 이득이에요`}}}),{timeMsg:'행사가 끝났어요'})
];

/* ---------- taste store ---------- */
const KEY='swipe-mini-v3';
const fresh=()=>({scores:{reflex:0,puzzle:0,horror:0,chill:0,biz:0},plays:0,best:0});
let store=fresh();
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&p.scores)store=Object.assign(fresh(),p)}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const bump=(g,v)=>{store.scores[g.genre]=(store.scores[g.genre]||0)+v;save()};

/* ---------- run state ---------- */
let run={hearts:3,score:0,over:false};
const level=()=>1+Math.floor(run.score/4);
const mul=()=>Math.max(.55,1-(level()-1)*.08);
const hud=document.getElementById('hud');
function drawHud(hurt){hud.querySelector('[data-h]').textContent='❤️'.repeat(Math.max(0,run.hearts))+'🖤'.repeat(3-Math.max(0,run.hearts));
  hud.querySelector('[data-sc]').textContent=run.score+'점';hud.querySelector('[data-lv]').textContent='속도 '+level();
  if(hurt){hud.classList.remove('hit');void hud.offsetWidth;hud.classList.add('hit')}}
hud.querySelector('[data-mute]').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊';e.currentTarget.setAttribute('aria-label',muted?'소리 켜기':'소리 끄기')});

/* ---------- feed ---------- */
const stage=document.getElementById('stage');
const hist=[];let count=0,cur=null,busy=false,sheetOpen=false,swipes=0;
let queue=shuffle(Object.keys(GENRES)).map(k=>rnd(GAMES.filter(g=>g.genre===k)));
function pickNext(){
  if(queue.length)return queue.shift();
  const recent=hist.slice(-18),cand=GAMES.filter(g=>!recent.includes(g.id));
  if(Math.random()<.7){const best=Math.max(...cand.map(g=>store.scores[g.genre]));return rnd(cand.filter(g=>store.scores[g.genre]===best))}
  return rnd(cand);
}
function makeCard(g){
  const n=++count;hist.push(g.id);
  const el=$(`<section class="card" style="--bg:${g.bg};--ink:${g.ink}" aria-label="${g.title}">
    <div class="play"><div class="fuse"><i></i></div><div class="tip">${g.cmd}</div><div class="cmd">${g.cmd}</div><div class="inner"></div></div>
    <div class="meta"><p class="count">${n}번째 판</p><h2>${g.title}</h2><div class="tags"><span>${GENRES[g.genre]}</span><span>${g.tempo}</span></div></div>
    <div class="rail">
      <button data-like aria-pressed="false" aria-label="좋아요"><span>♡</span><small>좋아요</small></button>
      <button data-retry aria-label="연습으로 다시 하기"><span>↻</span><small>다시</small></button>
      <button data-me aria-label="내 취향 보기"><span>◔</span><small>내 취향</small></button>
      <button data-next aria-label="다음 게임"><span>↑</span><small>다음</small></button>
    </div></section>`);
  return{g,el,inner:el.querySelector('.inner'),state:'idle',shownAt:Date.now(),rt:null,credited:false,liked:false};
}
function introCard(){
  const el=$(`<section class="card intro" style="--bg:#1B1F3B;--ink:#FFFFFF"><div class="play">
    <button class="over start" style="background:none"><h1>넘겨<br>한 판</h1><p class="sub">5초짜리 게임이 끝없이 나와요.<br>위로 넘기면 바로 다음 판. 하트 3개가 다 떨어지면 끝.</p><span class="pill solid" style="display:flex;align-items:center;justify-content:center;min-width:180px;flex:none">탭해서 시작</span><span class="credit"><svg width="22" height="22" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="6" fill="#000"/><circle cx="10" cy="9" r="4" fill="#fff"/><rect x="6" y="15" width="8" height="8" fill="#fff"/><path d="M17 9 L17 25 L28 25 Z" fill="#fff"/></svg>Created by manamiwu</span></button>
  </div></section>`);
  return{intro:true,el,state:'intro'};
}

function play(S,practice){
  S.el.querySelectorAll('.res').forEach(o=>o.remove());
  if(S.rt)S.rt.clear();
  const ni=document.createElement('div');ni.className='inner';S.inner.replaceWith(ni);S.inner=ni;
  const rt=S.rt=makeRT(),lv=level(),T=Math.round(S.g.T*mul());S.state='playing';S.practice=practice;
  const cmd=S.el.querySelector('.cmd'),tip=S.el.querySelector('.tip'),fuse=S.el.querySelector('.fuse i');
  fuse.classList.remove('run');fuse.style.animationPlayState='';tip.classList.remove('on');
  cmd.classList.remove('show');void cmd.offsetWidth;cmd.classList.add('show');sfx.go();
  let done=false;
  const finish=(ok,msg)=>{if(done)return;done=true;rt.clear();S.state='done';fuse.style.animationPlayState='paused';result(S,ok,msg,practice)};
  rt.to(()=>{
    tip.classList.add('on');fuse.style.animationDuration=T+'ms';void fuse.offsetWidth;fuse.classList.add('run');
    S.g.mount(ni,{rt,lv,T,win:m=>finish(true,m),lose:m=>finish(false,m),tap:sfx.tap});
    rt.to(()=>S.g.timeout==='win'?finish(true,S.g.winMsg):finish(false,S.g.timeMsg),T);
  },reduce?200:620);
}

function result(S,ok,msg,practice){
  const host=S.el.querySelector('.play');
  const o=$(`<div class="over res ${ok?'win':'lose'}"><div class="stamp">${ok?'성공!':'실패'}</div><p class="sub">${msg}</p>${practice?'<p class="sub" style="font-size:13px">연습 판이라 하트는 그대로예요</p>':''}<p class="hint">↑ 밀어서 다음 판</p></div>`);
  if(ok){sfx.win();buzz(25);confetti(host)}else{sfx.lose();buzz([60,40,60]);shake(S.el)}
  setTimeout(()=>host.appendChild(o),ok?80:300);
  if(!S.credited){S.credited=true;store.plays++;bump(S.g,ok?1:.5)}
  if(!practice){if(ok)run.score++;else run.hearts--;drawHud(!ok);
    if(run.hearts<=0){run.over=true;store.best=Math.max(store.best,run.score);save();setTimeout(()=>openSheet(true),1100)}}
}

function leave(S){
  if(S.intro)return;
  if(S.state==='playing'||S.state==='idle')bump(S.g,Date.now()-S.shownAt<1500?-2:-1);
  if(S.rt)S.rt.clear();
}
function tryNext(){
  if(busy||sheetOpen)return;
  if(run.over){openSheet(true);return}
  leave(cur);
  const S=makeCard(pickNext());S.el.classList.add('below');stage.appendChild(S.el);S.el.getBoundingClientRect();
  busy=true;const old=cur;old.el.classList.add('above');S.el.classList.remove('below');cur=S;
  setTimeout(()=>{old.el.remove();busy=false;S.shownAt=Date.now();if(cur===S)play(S,false)},reduce?0:340);
  swipes++;
}

/* ---------- sheet ---------- */
function openSheet(isOver){
  if(sheetOpen)return;sheetOpen=true;
  if(cur&&cur.rt&&cur.state==='playing'){cur.rt.clear();cur.state='idle'}
  const ks=Object.keys(GENRES),sc=store.scores,vals=ks.map(k=>sc[k]),mn=Math.min(...vals),mx=Math.max(...vals);
  const norm=v=>mx===mn?50:Math.round(8+92*(v-mn)/(mx-mn));
  const top=ks.reduce((a,b)=>sc[b]>sc[a]?b:a),enough=store.plays>=4&&mx>mn;
  const title=enough?TYPES[top][0]:'아직 알아가는 중',desc=enough?TYPES[top][1]:'몇 판 더 넘기다 보면 취향이 보이기 시작해요.';
  const sh=$(`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${isOver?'게임 오버':'내 게임 취향'}">
    ${isOver?`<p class="lead">게임 오버</p><div class="over-score">${run.score}점</div><p class="lead">최고 기록 ${store.best}점 (속도 ${level()}까지 갔어요)</p><hr>`:''}
    <h3>${title}</h3><p class="desc">${desc}</p>
    <ul class="bars">${ks.map(k=>`<li><span>${GENRES[k]}</span><div><i style="width:0%" data-w="${norm(sc[k])}"></i></div></li>`).join('')}</ul>
    <p class="note">바로 넘긴 게임은 점수가 내려가고 좋아요와 다시 하기는 크게 올라가요. 취향 쪽 게임이 더 자주 나와요.</p>
    <div class="row">${isOver?'<button class="pill solid" data-restart>다시 도전</button>':'<button class="pill solid" data-close>계속 넘기기</button>'}<button class="pill" data-copy>결과 복사</button></div>
  </div></div>`);
  document.body.appendChild(sh);
  requestAnimationFrame(()=>sh.querySelectorAll('.bars i').forEach(i=>i.style.width=i.dataset.w+'%'));
  const close=()=>{sh.remove();sheetOpen=false};
  sh.addEventListener('click',async e=>{
    if(e.target.closest('[data-close]')||(e.target===sh&&!isOver)){close();if(cur&&!cur.intro&&cur.state==='idle')play(cur,cur.practice)}
    else if(e.target.closest('[data-restart]')){run={hearts:3,score:0,over:false};drawHud();close();tryNext()}
    else if(e.target.closest('[data-copy]')){
      const txt=isOver?`넘겨 한 판 ${run.score}점! 내 게임 취향은 ${title}`:`넘겨 한 판 내 게임 취향: ${title}`;
      try{await navigator.clipboard.writeText(txt);toast('결과를 복사했어요')}catch(err){toast('이 화면에서는 복사가 막혀 있어요')}}
  });
  sh.querySelector('button').focus();
}

let tId;function toast(msg){let t=document.querySelector('.toast');if(!t){t=$('<div class="toast" role="status"><span></span></div>');document.body.appendChild(t)}
  t.querySelector('span').textContent=msg;t.style.display='block';clearTimeout(tId);tId=setTimeout(()=>t.style.display='none',1500)}

/* ---------- input ---------- */
let sy=null,st=0,moved=false;
stage.addEventListener('pointerdown',e=>{sy=e.clientY;st=Date.now();moved=false});
stage.addEventListener('pointermove',e=>{if(sy!==null&&Math.abs(e.clientY-sy)>14)moved=true});
stage.addEventListener('pointerup',e=>{if(sy===null)return;const dy=e.clientY-sy;sy=null;if(dy<-60&&Date.now()-st<800&&!(cur&&cur.intro))tryNext()});
stage.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
stage.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!cur)return;
  if(cur.intro&&b.classList.contains('start')){ac();tryNext();return}
  if(b.hasAttribute('data-next'))tryNext();
  else if(b.hasAttribute('data-me'))openSheet(false);
  else if(b.hasAttribute('data-retry')){if(cur.state!=='done'){toast('이 판이 끝나면 다시 할 수 있어요');return}if(run.over)return;bump(cur.g,2);play(cur,true)}
  else if(b.hasAttribute('data-like')){cur.liked=!cur.liked;b.setAttribute('aria-pressed',cur.liked);b.querySelector('span').textContent=cur.liked?'♥':'♡';
    bump(cur.g,cur.liked?2:-2);if(cur.liked){toast('이런 게임을 더 자주 보여줄게요');buzz(15)}}
});
let wheelLock=0;
stage.addEventListener('wheel',e=>{if(e.deltaY>30&&Date.now()>wheelLock&&!(cur&&cur.intro)){wheelLock=Date.now()+700;tryNext()}},{passive:true});
document.addEventListener('keydown',e=>{if((e.key==='ArrowDown'||e.key==='PageDown')&&!sheetOpen){e.preventDefault();if(cur.intro)ac();tryNext()}});

cur=introCard();stage.appendChild(cur.el);drawHud();
</script>
</body>
